---
# Part A — Base Server Preparation 
# Covers: system update, base packages, Node.js 20.x, MongoDB 7.0 
 - name: Update system and install base tools
   block:
          - name: update all packages
            dnf:
                name: "*"
                state: latest
          - name: install base packages
            dnf:
                name:
                    - git
                    - vim
                    - curl 
                    - wget
                    - firewalld
                state: present
           - name: Enable and start firewalld
             service:
                name: firewalld
                state: started
                enabled: yes
   resuce:
           - name: Base prep failed
             debug:
                msg: "Base server preparation failed. Check dnf/repo connectivity"
   always: 
        - name: Base prep step completed
          debug:
                msg: "Base server preparation step finished (success or failure)."
 - name: Download NodeSource setup script
   get_url:
        url: "{{node_repo_setup_url}}"   
        dest: /tmp/nodesource_setup.sh
        mode: '0755'
 - name: Run NodeSource setup script
   commands: bash /tmp/nodesource_setup.sh
   changed_when: "'Repository configured' in node_setup_result.stdout or node_setup_result.rc == 0"
     A
 - name: Install node.js
   dnf:
      name: nodejs
      state: present
        A
 - name: Confirm Node.js version
   command: node -v
   regiester: node_version
   changed_when: false
 - name: Node.js version
   debug:
        msg: "Installed Node.js version: {{ node_version.stdout }}"
 - name: Add MongoDB repo file
   template:
     src: mongodb.repo.j2
     dest: /etc/yum.repos.d/mongodb-org-7.0.repo
- name: Install MongoDB
  dnf:
      name: mongodb-org
      state: present
        A
- name: Enable and start MongoDB
  service:
    name: mongod
    state: started
    enabled: yes
- name: Check MongoDB service status
  command: systemctl is-active mongod
  register: mongo_status
  changed_when: false
- name: Show MongoDB status
  debug:
  msg: "MongoDB status: {{ mongo_status.stdout }}"
  when: mongo_status.stdout == "active 
